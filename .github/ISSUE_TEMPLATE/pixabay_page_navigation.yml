name: Pixabay Page Navigation Bug Report
description: Report an issue for the Pixabay Page Navigation userscript
title: "[Pixabay] [Page Navigation] "
labels: ["bug"]
body:
  - type: input
    id: script_version
    attributes:
      label: Script Version
      description: What version of the script are you using?
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue here...
    validations:
      required: true
