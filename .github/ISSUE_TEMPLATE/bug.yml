name: Bug Report
description: Report an issue for a userscript
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category / Main Script
      description: Which script category is this about?
      options:
        - 10fastfingers
        - AI Queue
        - Google Forms
        - Pixabay
        - W3Schools
        - YouTube
        - Other
    validations:
      required: true
  - type: input
    id: specific_script
    attributes:
      label: Specific Script
      description: If applicable, which specific script is this about? (e.g., ChatGPT Prompt Queue, Enter Retest)
    validations:
      required: false
  - type: input
    id: script_version
    attributes:
      label: Script Version
      description: What version of the script are you using?
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug here...
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
