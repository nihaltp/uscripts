name: Build Google Forms Userscript

on:
  push:
    paths:
      - 'google_forms/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'google_forms/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Google Forms
      run: npm run build-google-forms
      
    - name: Commit dist folder
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f "google_forms/dist/"
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update google_forms dist" && git push)
