name: Build Google Calendar Userscript

on:
  push:
    paths:
      - 'google_calendar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-calendar.yml'
  pull_request:
    paths:
      - 'google_calendar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-calendar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Google Calendar
      run: npm run build-google-calendar
      
    - name: Commit dist folder
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f "google_calendar/dist/"
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update google_calendar dist" && git push)
