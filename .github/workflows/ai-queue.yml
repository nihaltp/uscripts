name: Build AI Queue Userscripts

on:
  push:
    paths:
      - 'AI Queue/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'AI Queue/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build AI Queue
      run: npm run build-aiqueue
      
    - name: Commit dist folder
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f "AI Queue/dist/"
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update AI Queue dist [skip ci]" && git push)
