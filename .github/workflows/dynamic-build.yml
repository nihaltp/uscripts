name: Build Userscripts Dynamically

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        dir_names: true
        dir_names_max_depth: 1
        
    - name: Build and Commit
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        PUSH_NEEDED=false
        
        for dir in ${{ steps.changed-files.outputs.all_changed_files }}; do
          # Check if the directory exists and has a build.js
          if [ -d "$dir" ] && [ -f "$dir/build.js" ]; then
            echo "Building $dir..."
            node "$dir/build.js"
            
            git add -f "$dir/dist/"
            
            # Check if there are staged changes
            if ! git diff --staged --quiet; then
              git commit -m "chore: update $dir dist"
              PUSH_NEEDED=true
            else
              echo "No changes to commit for $dir/dist"
            fi
          fi
        done
        
        if [ "$PUSH_NEEDED" = true ] && [ "${{ github.event_name }}" != "pull_request" ]; then
          git push
        fi
